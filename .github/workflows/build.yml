name: Flutter APK Cloud Compiler
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          # Yeh command aapki repository ke andar padi hui zip ko furan extract karegi
          unzip *.zip -d extracted_project
          
          # Automated path solver for nested folders
          find extracted_project -name "pubspec.yaml" -exec dirname {} \; > project_path.txt
          PROJECT_DIR=$(cat project_path.txt)
          echo "Found project root at: $PROJECT_DIR"
          cp -r $PROJECT_DIR/* .
          cp -r $PROJECT_DIR/.* . 2>/dev/null || true

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Compiler
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fetch App Dependencies
        run: flutter pub get

      - name: Compile Asli APK
        run: flutter build apk --release

      - name: Save Real APK File
        uses: actions/upload-artifact@v4
        with:
          name: Real-BTS-Army-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
