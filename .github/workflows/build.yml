name: Build BTS Army World APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Find and extract Flutter ZIP
      - name: Extract Flutter Project
        shell: bash
        run: |
          set -e

          echo "Searching for Flutter project..."

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Flutter project ZIP not found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q "$ZIP_FILE" -d extracted_project

          PROJECT_DIR=$(find extracted_project -type f -name "pubspec.yaml" -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found inside ZIP."
            find extracted_project -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Flutter project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 3. Java
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      # 4. Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Version
        run: flutter --version

      # 5. Fix old flutter_wallpaper_manager
      - name: Patch Wallpaper Manager Plugin
        shell: bash
        run: |
          set -e

          PUBSPEC="$PROJECT_DIR/pubspec.yaml"

          if [ ! -f "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          echo "Checking wallpaper manager dependency..."

          grep -n "flutter_wallpaper_manager" "$PUBSPEC" || true

      # 6. Flutter clean/get
      - name: Flutter Clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter clean

      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      # 7. Fix Android SDK compatibility
      - name: Configure Android Build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APP_GRADLE="android/app/build.gradle.kts"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: $APP_GRADLE not found."
            exit 1
          fi

          echo "Using:"
          echo "$APP_GRADLE"

          python3 - "$APP_GRADLE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # ------------------------------------------------
          # compileSdk
          # ------------------------------------------------

          text = re.sub(
              r'compileSdk\s*=\s*\d+',
              'compileSdk = 35',
              text,
              count=1
          )

          # ------------------------------------------------
          # Core library desugaring
          # ------------------------------------------------

          if "isCoreLibraryDesugaringEnabled = true" not in text:

              if "compileOptions {" in text:
                  text = text.replace(
                      "compileOptions {",
                      """compileOptions {
                  isCoreLibraryDesugaringEnabled = true""",
                      1
                  )

              elif "android {" in text:
                  text = text.replace(
                      "android {",
                      """android {

              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              """,
                      1
                  )

          # ------------------------------------------------
          # Desugaring dependency
          # ------------------------------------------------

          if "desugar_jdk_libs" not in text:

              dependency = """
          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
          }
          """

              text += dependency

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Android build configuration updated.")
          PY

          echo "----- FINAL build.gradle.kts -----"
          cat "$APP_GRADLE"

      # 8. Patch flutter_wallpaper_manager Android manifest
      - name: Patch Wallpaper Manager Android Manifest
        shell: bash
        run: |
          set -e

          PLUGIN_DIR=$(find "$HOME/.pub-cache/hosted/pub.dev" \
            -maxdepth 1 \
            -type d \
            -name "flutter_wallpaper_manager-*" \
            | head -n 1)

          if [ -z "$PLUGIN_DIR" ]; then
            echo "Wallpaper manager plugin not found."
            exit 0
          fi

          MANIFEST="$PLUGIN_DIR/android/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then
            echo "Patching:"
            echo "$MANIFEST"

            sed -i \
              's/package="com\.pk\.wallpapermanager\.flutter_wallpaper_manager"//g' \
              "$MANIFEST"

            echo "Manifest patched."
            cat "$MANIFEST"
          fi

      # 9. Patch plugin namespace + compile SDK
      - name: Patch Wallpaper Manager Gradle
        shell: bash
        run: |
          set -e

          PLUGIN_DIR=$(find "$HOME/.pub-cache/hosted/pub.dev" \
            -maxdepth 1 \
            -type d \
            -name "flutter_wallpaper_manager-*" \
            | head -n 1)

          if [ -z "$PLUGIN_DIR" ]; then
            echo "Wallpaper manager plugin not found."
            exit 0
          fi

          GRADLE_FILE="$PLUGIN_DIR/android/build.gradle"

          if [ -f "$GRADLE_FILE" ]; then

            python3 - "$GRADLE_FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # Add namespace if missing
          if "namespace" not in text:

              if "android {" in text:
                  text = text.replace(
                      "android {",
                      """android {
              namespace "com.pk.wallpapermanager.flutter_wallpaper_manager"
              """,
                      1
                  )

          # Make old plugin compile against modern SDK
          text = re.sub(
              r'compileSdkVersion\s+\d+',
              'compileSdkVersion 35',
              text
          )

          text = re.sub(
              r'compileSdk\s+\d+',
              'compileSdk 35',
              text
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Wallpaper manager Gradle patched.")
          PY

            cat "$GRADLE_FILE"
          fi

      # 10. Build APK
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILDING RELEASE APK"
          echo "========================================"

          flutter clean
          flutter pub get

          flutter build apk \
            --release \
            --android-skip-build-dependency-validation

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BTS-Army-World-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
