name: Flutter APK Cloud Compiler

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Flutter Project
        shell: bash
        run: |
          set -e

          echo "Checking repository files..."
          find . -maxdepth 2 -type f | head -100

          # If a ZIP exists, extract it
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP found: $ZIP_FILE"

            mkdir -p extracted_project
            unzip -o "$ZIP_FILE" -d extracted_project

            echo "Searching extracted project..."
            PUBSPEC=$(find extracted_project \
              -type f \
              -name "pubspec.yaml" \
              -print -quit)

          else
            echo "No ZIP found. Searching repository..."
            PUBSPEC=$(find . \
              -not -path "./.git/*" \
              -type f \
              -name "pubspec.yaml" \
              -print -quit)
          fi

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml could not be found."
            echo "Repository structure:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "================================="
          echo "Flutter project found:"
          echo "$PROJECT_DIR"
          echo "================================="

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter clean

      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Fix flutter_wallpaper_manager Namespace
        shell: bash
        run: |
          set -e

          echo "Searching for flutter_wallpaper_manager..."

          PACKAGE_DIR=$(find "$HOME/.pub-cache" \
            -type d \
            -path "*/flutter_wallpaper_manager-*/android" \
            -print -quit || true)

          if [ -z "$PACKAGE_DIR" ]; then
            echo "ERROR: flutter_wallpaper_manager Android folder not found."
            exit 1
          fi

          BUILD_FILE="$PACKAGE_DIR/build.gradle"

          echo "Plugin build.gradle:"
          echo "$BUILD_FILE"

          python3 - "$BUILD_FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          if re.search(r'(?m)^\s*namespace\s+["\']', text):
              print("Namespace already exists.")
          else:
              match = re.search(r'android\s*\{', text)

              if not match:
                  raise SystemExit(
                      "ERROR: android { block not found."
                  )

              namespace = 'namespace "com.flutter_wallpaper_manager"'

              text = (
                  text[:match.end()]
                  + "\n    "
                  + namespace
                  + "\n"
                  + text[match.end():]
              )

              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)

              print("Namespace added successfully.")

          PY

          grep -q 'namespace "com.flutter_wallpaper_manager"' "$BUILD_FILE"

          echo "Namespace verification successful."

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Save Real APK File
        uses: actions/upload-artifact@v4
        with:
          name: BTS-Army-World-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk        
