name: Flutter APK Cloud Compiler

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Flutter Project
        shell: bash
        run: |
          set -e

          echo "Repository:"
          find . -maxdepth 2 -type f | sort

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" -print -quit || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "ZIP:"
          echo "$ZIP_FILE"

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -o "$ZIP_FILE" -d extracted_project >/dev/null

          echo "Searching for pubspec.yaml..."

          PUBSPEC=$(find extracted_project \
            -type f \
            -name "pubspec.yaml" \
            -print -quit || true)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found inside ZIP."
            find extracted_project -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project:"
          echo "$PROJECT_DIR"

          echo "Checking Android files..."

          APP_GRADLE=$(find "$PROJECT_DIR" \
            -type f \
            \( -path "*/android/app/build.gradle" \
               -o -path "*/android/app/build.gradle.kts" \) \
            -print -quit || true)

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: Android app Gradle file not found."

            echo "Android files inside project:"
            find "$PROJECT_DIR/android" \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print || true

            exit 1
          fi

          echo "APP_GRADLE=$APP_GRADLE" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "================================"
          echo "PROJECT_DIR:"
          echo "$PROJECT_DIR"
          echo "================================"

          echo "================================"
          echo "APP_GRADLE:"
          echo "$APP_GRADLE"
          echo "================================"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Version
        run: flutter --version

      - name: Flutter Clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter clean

      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      # ==========================================
      # WALLPAPER MANAGER NAMESPACE
      # ==========================================

      - name: Fix Wallpaper Manager Namespace
        shell: bash
        run: |
          set -e

          PLUGIN_DIR=$(find "$HOME/.pub-cache/hosted/pub.dev" \
            -maxdepth 1 \
            -type d \
            -name "flutter_wallpaper_manager-*" \
            -not -name "*-example" \
            | sort -V | tail -n 1 || true)

          if [ -z "$PLUGIN_DIR" ]; then
            echo "flutter_wallpaper_manager not found."
            exit 1
          fi

          PLUGIN_BUILD="$PLUGIN_DIR/android/build.gradle"

          if [ ! -f "$PLUGIN_BUILD" ]; then
            echo "ERROR: Plugin build.gradle not found."
            exit 1
          fi

          python3 - "$PLUGIN_BUILD" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          if not re.search(r'(?m)^\s*namespace\s+["\']', text):

              match = re.search(r'android\s*\{', text)

              if not match:
                  raise SystemExit(
                      "ERROR: android block not found in plugin."
                  )

              text = (
                  text[:match.end()]
                  + '\n    namespace "com.flutter_wallpaper_manager"\n'
                  + text[match.end():]
              )

              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)

          print("Wallpaper manager namespace OK.")
          PY

      # ==========================================
      # CORE LIBRARY DESUGARING
      # ==========================================

      - name: Enable Core Library Desugaring
        shell: bash
        run: |
          set -e

          echo "Patching:"
          echo "$APP_GRADLE"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: App Gradle file disappeared."
            exit 1
          fi

          case "$APP_GRADLE" in
            *.gradle.kts)
              echo "Gradle Kotlin DSL detected."
              echo "This project uses build.gradle.kts."
              ;;

            *.gradle)
              python3 - "$APP_GRADLE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # ------------------------------------------
          # compileOptions
          # ------------------------------------------

          if "coreLibraryDesugaringEnabled true" not in text:

              match = re.search(
                  r'compileOptions\s*\{',
                  text
              )

              if match:
                  pos = match.end()

                  text = (
                      text[:pos]
                      + "\n        coreLibraryDesugaringEnabled true\n"
                      + text[pos:]
                  )

              else:
                  android = re.search(
                      r'android\s*\{',
                      text
                  )

                  if not android:
                      raise SystemExit(
                          "ERROR: android block not found."
                      )

                  pos = android.end()

                  block = """
              
              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              """

                  text = text[:pos] + block + text[pos:]

          # ------------------------------------------
          # dependency
          # ------------------------------------------

          if "desugar_jdk_libs" not in text:

              match = re.search(
                  r'dependencies\s*\{',
                  text
              )

              if not match:
                  raise SystemExit(
                      "ERROR: dependencies block not found."
                  )

              pos = match.end()

              dependency = """
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
              """

              text = text[:pos] + dependency + text[pos:]

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Core library desugaring enabled.")
          PY
              ;;

            *)
              echo "ERROR: Unsupported Gradle file:"
              echo "$APP_GRADLE"
              exit 1
              ;;
          esac

      # ==========================================
      # BUILD
      # ==========================================

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      # ==========================================
      # APK ARTIFACT
      # ==========================================

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Real-BTS-Army-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
