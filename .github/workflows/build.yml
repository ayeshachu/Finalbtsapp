name: Flutter APK Cloud Compiler

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Clean
        run: flutter clean

      - name: Get Dependencies
        run: flutter pub get

      # FIX flutter_wallpaper_manager namespace
      - name: Patch flutter_wallpaper_manager
        shell: bash
        run: |
          set -e

          echo "Searching for flutter_wallpaper_manager..."

          PACKAGE_DIR=$(find "$HOME/.pub-cache" \
            -type d \
            -path "*/flutter_wallpaper_manager-*/android" \
            | head -n 1)

          if [ -z "$PACKAGE_DIR" ]; then
            echo "ERROR: flutter_wallpaper_manager Android folder not found."
            exit 1
          fi

          echo "Found package:"
          echo "$PACKAGE_DIR"

          BUILD_FILE="$PACKAGE_DIR/build.gradle"

          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found."
            exit 1
          fi

          echo "Before patch:"
          cat "$BUILD_FILE"

          python3 - "$BUILD_FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          namespace = 'namespace "com.flutter_wallpaper_manager"'

          if re.search(r'(?m)^\s*namespace\s+["\']', text):
              print("Namespace already exists.")
          else:
              match = re.search(r'android\s*\{', text)

              if not match:
                  raise SystemExit(
                      "ERROR: android { block not found in plugin build.gradle"
                  )

              pos = match.end()

              text = (
                  text[:pos]
                  + "\n    "
                  + namespace
                  + "\n"
                  + text[pos:]
              )

              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)

              print("Namespace added successfully.")

          PY

          echo "After patch:"
          cat "$BUILD_FILE"

          echo "Verifying namespace..."

          grep -q 'namespace "com.flutter_wallpaper_manager"' "$BUILD_FILE"

          echo "SUCCESS: Namespace verified."

      # Build APK
      - name: Build Release APK
        run: flutter build apk --release

      # Save APK
      - name: Save Real APK File
        uses: actions/upload-artifact@v4
        with:
          name: BTS-Army-World-APK
          path: build/app/outputs/flutter-apk/app-release.apk
