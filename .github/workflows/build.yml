name: Flutter APK Cloud Compiler

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Extract Flutter Project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP found: $ZIP_FILE"

            rm -rf extracted_project
            mkdir extracted_project

            unzip -q "$ZIP_FILE" -d extracted_project

            PUBSPEC=$(find extracted_project \
              -type f \
              -name "pubspec.yaml" \
              -print -quit)
          else
            echo "No ZIP found. Searching repository..."
            PUBSPEC=$(find . \
              -not -path "./.git/*" \
              -type f \
              -name "pubspec.yaml" \
              -print -quit)
          fi

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project root: $PROJECT_DIR"

          if [ "$PROJECT_DIR" != "." ]; then
            shopt -s dotglob
            cp -R "$PROJECT_DIR"/* .
            shopt -u dotglob
          fi

          test -f pubspec.yaml

          echo "Flutter project successfully prepared."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show Flutter Version
        run: |
          flutter --version
          dart --version

      - name: Flutter Clean
        run: flutter clean

      - name: Get Dependencies
        run: flutter pub get

      # ==========================================
      # FIX FLUTTER WALLPAPER MANAGER NAMESPACE
      # ==========================================

      - name: Fix flutter_wallpaper_manager Namespace
        shell: bash
        run: |
          set -e

          PLUGIN_DIR=$(find "$HOME/.pub-cache/hosted/pub.dev" \
            -maxdepth 1 \
            -type d \
            -name "flutter_wallpaper_manager-*" \
            -not -name "*-example" \
            | sort -V | tail -n 1)

          if [ -z "$PLUGIN_DIR" ]; then
            echo "ERROR: flutter_wallpaper_manager not found."
            exit 1
          fi

          echo "Plugin directory:"
          echo "$PLUGIN_DIR"

          PLUGIN_BUILD="$PLUGIN_DIR/android/build.gradle"

          if [ ! -f "$PLUGIN_BUILD" ]; then
            echo "ERROR: Actual plugin build.gradle not found."
            exit 1
          fi

          python3 - "$PLUGIN_BUILD" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          if re.search(r'(?m)^\s*namespace\s+["\']', text):
              print("Namespace already exists.")
          else:
              match = re.search(r'android\s*\{', text)

              if not match:
                  raise SystemExit(
                      "ERROR: android { block not found in actual plugin."
                  )

              namespace = 'namespace "com.flutter_wallpaper_manager"'

              text = (
                  text[:match.end()]
                  + "\n    "
                  + namespace
                  + "\n"
                  + text[match.end():]
              )

              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)

              print("Namespace added successfully.")

          PY

          grep -q 'namespace "com.flutter_wallpaper_manager"' "$PLUGIN_BUILD"

          echo "Namespace verification successful."

      # ==========================================
      # FIX FLUTTER LOCAL NOTIFICATIONS DESUGARING
      # ==========================================

      - name: Enable Core Library Desugaring
        shell: bash
        run: |
          set -e

          APP_GRADLE="android/app/build.gradle"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: android/app/build.gradle not found."
            exit 1
          fi

          python3 - "$APP_GRADLE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # ------------------------------------------
          # Add compileOptions
          # ------------------------------------------

          if "coreLibraryDesugaringEnabled true" not in text:

              compile_match = re.search(
                  r'compileOptions\s*\{',
                  text
              )

              if compile_match:
                  pos = compile_match.end()

                  text = (
                      text[:pos]
                      + "\n        coreLibraryDesugaringEnabled true\n"
                      + text[pos:]
                  )

              else:

                  android_match = re.search(
                      r'android\s*\{',
                      text
                  )

                  if not android_match:
                      raise SystemExit(
                          "ERROR: android { block not found."
                      )

                  pos = android_match.end()

                  block = """
              
              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              """

                  text = (
                      text[:pos]
                      + block
                      + text[pos:]
                  )

          # ------------------------------------------
          # Add desugaring dependency
          # ------------------------------------------

          dependency = (
              "coreLibraryDesugaring "
              "'com.android.tools:desugar_jdk_libs:2.1.5'"
          )

          if "desugar_jdk_libs" not in text:

              dependency_match = re.search(
                  r'dependencies\s*\{',
                  text
              )

              if not dependency_match:
                  raise SystemExit(
                      "ERROR: dependencies { block not found."
                  )

              pos = dependency_match.end()

              text = (
                  text[:pos]
                  + "\n    "
                  + dependency
                  + "\n"
                  + text[pos:]
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print(
              "Core library desugaring enabled successfully."
          )

          PY

          echo "Updated android/app/build.gradle:"
          cat "$APP_GRADLE"

      # ==========================================
      # VERIFY
      # ==========================================

      - name: Verify Project
        run: |
          test -f pubspec.yaml
          test -f android/app/build.gradle
          flutter pub get

      # ==========================================
      # BUILD APK
      # ==========================================

      - name: Build Release APK
        run: flutter build apk --release

      # ==========================================
      # SAVE APK
      # ==========================================

      - name: Save Real APK File
        uses: actions/upload-artifact@v4
        with:
          name: Real-BTS-Army-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
