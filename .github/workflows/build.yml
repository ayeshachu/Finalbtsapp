name: Flutter APK Cloud Compiler

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. FIND AND EXTRACT FLUTTER PROJECT ZIP
      # =========================================================
      - name: Extract Flutter Project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Searching for Flutter ZIP..."
          echo "========================================"

          ZIP_FILE=""

          if [ -f "BTS_Army_World_NAMESPACE_FIXED.zip" ]; then
            ZIP_FILE="BTS_Army_World_NAMESPACE_FIXED.zip"
          else
            ZIP_FILE=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q "$ZIP_FILE" -d extracted_project

          echo "========================================"
          echo "Searching for pubspec.yaml..."
          echo "========================================"

          PUBSPEC=$(find extracted_project \
            -type f \
            -name "pubspec.yaml" \
            -not -path "*/.dart_tool/*" \
            | head -n 1 || true)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found inside ZIP."
            echo "ZIP contents:"
            find extracted_project -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project root:"
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
            echo "ERROR: Invalid Flutter project root."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "========================================"
          echo "Flutter project found successfully."
          echo "========================================"


      # =========================================================
      # 3. JAVA
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"


      # =========================================================
      # 4. FLUTTER
      # =========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true


      # =========================================================
      # 5. VERIFY PROJECT
      # =========================================================
      - name: Verify Flutter Project
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "Current directory:"
          pwd

          echo "Project files:"
          ls -la

          echo "Flutter version:"
          flutter --version

          echo "Pubspec:"
          test -f pubspec.yaml

          echo "Android directory:"
          test -d android


      # =========================================================
      # 6. CLEAN
      # =========================================================
      - name: Flutter Clean
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          flutter clean


      # =========================================================
      # 7. GET PACKAGES
      # =========================================================
      - name: Flutter Pub Get
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          flutter pub get


      # =========================================================
      # 8. FIX CORE LIBRARY DESUGARING
      #    For flutter_local_notifications
      # =========================================================
      - name: Enable Core Library Desugaring
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "========================================"
          echo "Finding Android app Gradle file..."
          echo "========================================"

          if [ -f "android/app/build.gradle.kts" ]; then
            APP_GRADLE="android/app/build.gradle.kts"
          elif [ -f "android/app/build.gradle" ]; then
            APP_GRADLE="android/app/build.gradle"
          else
            echo "ERROR: Android app Gradle file not found."
            find android -maxdepth 4 \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print
            exit 1
          fi

          echo "Using:"
          echo "$APP_GRADLE"

          python3 - "$APP_GRADLE" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # =====================================================
          # KOTLIN DSL
          # =====================================================
          if path.endswith(".gradle.kts"):

              # Add compileOptions
              if "isCoreLibraryDesugaringEnabled = true" not in text:

                  if "compileOptions {" in text:

                      text = text.replace(
                          "compileOptions {",
                          """compileOptions {
                          isCoreLibraryDesugaringEnabled = true""",
                          1
                      )

                  elif "android {" in text:

                      text = text.replace(
                          "android {",
                          """android {

                              compileOptions {
                                  isCoreLibraryDesugaringEnabled = true
                                  sourceCompatibility = JavaVersion.VERSION_17
                                  targetCompatibility = JavaVersion.VERSION_17
                              }
                          """,
                          1
                      )

                  else:
                      raise SystemExit(
                          "ERROR: android { block not found in Kotlin Gradle file."
                      )

              # Add desugaring dependency
              if "desugar_jdk_libs" not in text:

                  dependency = """
                      coreLibraryDesugaring(
                          "com.android.tools:desugar_jdk_libs:2.1.5"
                      )
                  """

                  if "dependencies {" in text:

                      text = text.replace(
                          "dependencies {",
                          "dependencies {" + dependency,
                          1
                      )

                  else:

                      text += """

                      dependencies {
                          coreLibraryDesugaring(
                              "com.android.tools:desugar_jdk_libs:2.1.5"
                          )
                      }
                      """

          # =====================================================
          # GROOVY DSL
          # =====================================================
          else:

              # Add compileOptions
              if "coreLibraryDesugaringEnabled true" not in text:

                  if "compileOptions {" in text:

                      text = text.replace(
                          "compileOptions {",
                          """compileOptions {
                          coreLibraryDesugaringEnabled true""",
                          1
                      )

                  elif "android {" in text:

                      text = text.replace(
                          "android {",
                          """android {

                              compileOptions {
                                  coreLibraryDesugaringEnabled true
                                  sourceCompatibility JavaVersion.VERSION_17
                                  targetCompatibility JavaVersion.VERSION_17
                              }
                          """,
                          1
                      )

                  else:
                      raise SystemExit(
                          "ERROR: android { block not found in Groovy Gradle file."
                      )

              # Add desugaring dependency
              if "desugar_jdk_libs" not in text:

                  dependency = """
                      coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
                  """

                  if "dependencies {" in text:

                      text = text.replace(
                          "dependencies {",
                          "dependencies {" + dependency,
                          1
                      )

                  else:

                      text += """

                      dependencies {
                          coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
                      }
                      """

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Core library desugaring configured successfully.")
          PY

          echo "========================================"
          echo "Final Android Gradle file:"
          echo "========================================"

          cat "$APP_GRADLE"


      # =========================================================
      # 9. FIX flutter_wallpaper_manager
      #    Old package= attribute + namespace
      # =========================================================
      - name: Fix flutter_wallpaper_manager
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Finding flutter_wallpaper_manager..."
          echo "========================================"

          PLUGIN_DIR=$(find "$HOME/.pub-cache/hosted/pub.dev" \
            -maxdepth 1 \
            -type d \
            -name "flutter_wallpaper_manager-*" \
            | head -n 1 || true)

          if [ -z "$PLUGIN_DIR" ]; then
            echo "ERROR: flutter_wallpaper_manager plugin not found."
            exit 1
          fi

          echo "Plugin:"
          echo "$PLUGIN_DIR"

          MANIFEST="$PLUGIN_DIR/android/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then

            echo "Fixing plugin AndroidManifest.xml..."

            python3 - "$MANIFEST" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # Remove obsolete package="..." from manifest.
          text = re.sub(
              r'\s+package\s*=\s*"[^"]*"',
              "",
              text,
              count=1
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Old package attribute removed.")
          PY

          fi

          # -----------------------------------------------------
          # Add namespace if plugin build.gradle needs it.
          # -----------------------------------------------------

          if [ -f "$PLUGIN_DIR/android/build.gradle.kts" ]; then

            PLUGIN_GRADLE="$PLUGIN_DIR/android/build.gradle.kts"

            python3 - "$PLUGIN_GRADLE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          namespace = "com.pk.wallpapermanager.flutter_wallpaper_manager"

          if "namespace" not in text:

              match = re.search(r'android\s*\{', text)

              if match:
                  pos = match.end()

                  text = (
                      text[:pos]
                      + f'\n    namespace = "{namespace}"\n'
                      + text[pos:]
                  )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Kotlin plugin namespace checked.")
          PY

          elif [ -f "$PLUGIN_DIR/android/build.gradle" ]; then

            PLUGIN_GRADLE="$PLUGIN_DIR/android/build.gradle"

            python3 - "$PLUGIN_GRADLE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          namespace = "com.pk.wallpapermanager.flutter_wallpaper_manager"

          if "namespace" not in text:

              match = re.search(r'android\s*\{', text)

              if match:
                  pos = match.end()

                  text = (
                      text[:pos]
                      + f'\n    namespace "{namespace}"\n'
                      + text[pos:]
                  )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Groovy plugin namespace checked.")
          PY

          fi

          echo "flutter_wallpaper_manager fix completed."


      # =========================================================
      # 10. BUILD APK
      # =========================================================
      - name: Build Release APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "========================================"
          echo "BUILDING RELEASE APK"
          echo "========================================"

          flutter build apk --release

          echo "========================================"
          echo "APK BUILD COMPLETED"
          echo "========================================"

          ls -lh build/app/outputs/flutter-apk/


      # =========================================================
      # 11. UPLOAD APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BTS-Army-World-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
