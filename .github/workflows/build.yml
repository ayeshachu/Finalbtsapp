name: Flutter APK Cloud Compiler

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Flutter Project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" -print -quit || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -o "$ZIP_FILE" -d extracted_project >/dev/null

          PUBSPEC=$(find extracted_project \
            -type f \
            -name "pubspec.yaml" \
            -print -quit || true)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Flutter project:"
          echo "$PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Version
        run: flutter --version

      - name: Flutter Clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter clean

      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      # ==========================================
      # FIND ACTUAL GRADLE FILE
      # ==========================================

      - name: Locate App Gradle
        shell: bash
        run: |
          set -e

          APP_GRADLE=$(find "$PROJECT_DIR/android/app" \
            -maxdepth 1 \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print -quit || true)

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: App Gradle file not found."
            exit 1
          fi

          echo "APP_GRADLE=$APP_GRADLE" >> "$GITHUB_ENV"

          echo "Found:"
          echo "$APP_GRADLE"

      # ==========================================
      # FIX KOTLIN DSL DESUGARING
      # ==========================================

      - name: Fix Core Library Desugaring
        shell: bash
        run: |
          set -e

          echo "Patching:"
          echo "$APP_GRADLE"

          python3 - "$APP_GRADLE" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # ---------------------------------------
          # compileOptions
          # ---------------------------------------

          if "isCoreLibraryDesugaringEnabled = true" not in text:

              if "compileOptions {" in text:

                  text = text.replace(
                      "compileOptions {",
                      """compileOptions {
                  isCoreLibraryDesugaringEnabled = true""",
                      1
                  )

              else:

                  marker = "android {"

                  if marker not in text:
                      raise SystemExit(
                          "ERROR: android block not found."
                      )

                  block = """
              
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              """

                  text = text.replace(
                      marker,
                      marker + block,
                      1
                  )

          # ---------------------------------------
          # desugar_jdk_libs dependency
          # ---------------------------------------

          dependency = """
              coreLibraryDesugaring(
                  "com.android.tools:desugar_jdk_libs:2.1.5"
              )
          """

          if "desugar_jdk_libs" not in text:

              if "dependencies {" in text:

                  text = text.replace(
                      "dependencies {",
                      "dependencies {" + dependency,
                      1
                  )

              else:

                  # Create dependencies block
                  text += """

              dependencies {
                  coreLibraryDesugaring(
                      "com.android.tools:desugar_jdk_libs:2.1.5"
                  )
              }
              """

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Core library desugaring configured successfully.")

          PY

          echo "========================================"
          echo "FINAL BUILD.GRADLE.KTS"
          echo "========================================"

          cat "$APP_GRADLE"

      # ==========================================
      # VERIFY
      # ==========================================

      - name: Verify Desugaring
        shell: bash
        run: |
          set -e

          grep -q "isCoreLibraryDesugaringEnabled = true" "$APP_GRADLE"
          grep -q "desugar_jdk_libs" "$APP_GRADLE"

          echo "Desugaring verification PASSED."

      # ==========================================
      # WALLPAPER MANAGER NAMESPACE
      # ==========================================

      - name: Fix Wallpaper Manager Namespace
        shell: bash
        run: |
          set -e

          PLUGIN_DIR=$(find "$HOME/.pub-cache/hosted/pub.dev" \
            -maxdepth 1 \
            -type d \
            -name "flutter_wallpaper_manager-*" \
            -not -name "*-example" \
            | sort -V | tail -n 1 || true)

          if [ -z "$PLUGIN_DIR" ]; then
            echo "Plugin not found."
            exit 1
          fi

          PLUGIN_BUILD="$PLUGIN_DIR/android/build.gradle"

          if [ ! -f "$PLUGIN_BUILD" ]; then
            echo "Plugin build.gradle not found."
            exit 1
          fi

          python3 - "$PLUGIN_BUILD" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          if "namespace" not in text:

              match = re.search(r'android\s*\{', text)

              if match:

                  text = (
                      text[:match.end()]
                      + '\n    namespace "com.flutter_wallpaper_manager"\n'
                      + text[match.end():]
                  )

                  with open(path, "w", encoding="utf-8") as f:
                      f.write(text)

          print("Wallpaper manager namespace checked.")

          PY

      # ==========================================
      # BUILD APK
      # ==========================================

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      # ==========================================
      # SAVE APK
      # ==========================================

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Real-BTS-Army-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
