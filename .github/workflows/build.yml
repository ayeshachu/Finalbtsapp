name: Flutter APK Cloud Compiler

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          mkdir extracted_project
          unzip -q *.zip -d extracted_project

          PROJECT_DIR=$(find extracted_project -name "pubspec.yaml" -print -quit | xargs dirname)

          echo "Project root: $PROJECT_DIR"

          cp -R "$PROJECT_DIR"/. .

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable

      - name: Flutter Version
        run: flutter --version

      - name: Get Dependencies
        run: flutter pub get

      - name: Clean Flutter Build
        run: flutter clean

      - name: Get Dependencies Again
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Save Real APK File
        uses: actions/upload-artifact@v4
        with:
          name: BTS-Army-World-APK
          path: build/app/outputs/flutter-apk/app-release.apk
