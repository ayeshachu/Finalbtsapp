name: Flutter APK Cloud Compiler

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # EXTRACT FLUTTER PROJECT
      # ==========================================

      - name: Extract Flutter Project
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP..."

          ZIP_FILE=$(find . -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            -print -quit || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -o "$ZIP_FILE" -d extracted_project >/dev/null

          echo "Searching for pubspec.yaml..."

          PUBSPEC=$(find extracted_project \
            -type f \
            -name "pubspec.yaml" \
            -print -quit || true)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"


      # ==========================================
      # FLUTTER
      # ==========================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Version
        run: flutter --version


      # ==========================================
      # CLEAN
      # ==========================================

      - name: Flutter Clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter clean


      # ==========================================
      # PUB GET
      # ==========================================

      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get


      # ==========================================
      # LOCATE APP GRADLE
      # ==========================================

      - name: Locate App Gradle
        shell: bash
        run: |
          set -e

          echo "Searching Android app Gradle file..."

          APP_GRADLE=$(find "$PROJECT_DIR/android/app" \
            -maxdepth 1 \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print -quit || true)

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: Android app Gradle file not found."

            find "$PROJECT_DIR/android" \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print || true

            exit 1
          fi

          echo "Actual Gradle file:"
          echo "$APP_GRADLE"

          echo "APP_GRADLE=$APP_GRADLE" >> "$GITHUB_ENV"


      # ==========================================
      # CORE LIBRARY DESUGARING
      # ==========================================

      - name: Fix Core Library Desugaring
        shell: bash
        run: |
          set -e

          echo "Patching:"
          echo "$APP_GRADLE"

          python3 - "$APP_GRADLE" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # ======================================
          # KOTLIN DSL
          # ======================================

          if path.endswith(".gradle.kts"):

              if "isCoreLibraryDesugaringEnabled = true" not in text:

                  if "compileOptions {" in text:

                      text = text.replace(
                          "compileOptions {",
                          """compileOptions {
                  isCoreLibraryDesugaringEnabled = true""",
                          1
                      )

                  print("Added Kotlin compileOptions.")

                  else:

                      marker = "android {"

                      if marker not in text:
                          raise SystemExit(
                              "ERROR: android block not found."
                          )

                      block = """
              
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              """

                      text = text.replace(
                          marker,
                          marker + block,
                          1
                      )

              dependency = """coreLibraryDesugaring(
                  "com.android.tools:desugar_jdk_libs:2.1.5"
              )"""

              if "desugar_jdk_libs" not in text:

                  if "dependencies {" in text:

                      text = text.replace(
                          "dependencies {",
                          "dependencies {\n    " + dependency,
                          1
                      )

                  else:

                      text += """

              dependencies {
                  coreLibraryDesugaring(
                      "com.android.tools:desugar_jdk_libs:2.1.5"
                  )
              }
              """

          # ======================================
          # GROOVY DSL
          # ======================================

          else:

              if "coreLibraryDesugaringEnabled true" not in text:

                  if "compileOptions {" in text:

                      text = text.replace(
                          "compileOptions {",
                          """compileOptions {
                  coreLibraryDesugaringEnabled true""",
                          1
                      )

                  else:

                      marker = "android {"

                      if marker not in text:
                          raise SystemExit(
                              "ERROR: android block not found."
                          )

                      block = """
              
              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              """

                      text = text.replace(
                          marker,
                          marker + block,
                          1
                      )

              dependency = """coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'"""

              if "desugar_jdk_libs" not in text:

                  if "dependencies {" in text:

                      text = text.replace(
                          "dependencies {",
                          "dependencies {\n    " + dependency,
                          1
                      )

                  else:

                      text += """

              dependencies {
                  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
              }
              """

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Core library desugaring configured successfully.")
          PY

          echo "========================================"
          echo "FINAL APP GRADLE"
          echo "========================================"

          cat "$APP_GRADLE"


      # ==========================================
      # VERIFY DESUGARING
      # ==========================================

      - name: Verify Desugaring
        shell: bash
        run: |
          set -e

          if ! grep -q "desugar_jdk_libs" "$APP_GRADLE"; then
            echo "ERROR: desugar_jdk_libs not found."
            exit 1
          fi

          echo "Desugaring dependency verified."


      # ==========================================
      # FIX WALLPAPER MANAGER
      # ==========================================

      - name: Fix Wallpaper Manager
        shell: bash
        run: |
          set -e

          echo "Finding flutter_wallpaper_manager..."

          PLUGIN_DIR=$(find "$HOME/.pub-cache/hosted/pub.dev" \
            -maxdepth 1 \
            -type d \
            -name "flutter_wallpaper_manager-*" \
            -not -name "*-example" \
            | sort -V | tail -n 1 || true)

          if [ -z "$PLUGIN_DIR" ]; then
            echo "ERROR: flutter_wallpaper_manager not found."
            exit 1
          fi

          echo "Plugin:"
          echo "$PLUGIN_DIR"

          PLUGIN_BUILD="$PLUGIN_DIR/android/build.gradle"
          PLUGIN_MANIFEST="$PLUGIN_DIR/android/src/main/AndroidManifest.xml"


          # ======================================
          # FIX PLUGIN NAMESPACE
          # ======================================

          if [ -f "$PLUGIN_BUILD" ]; then

            python3 - "$PLUGIN_BUILD" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          namespace = "com.pk.wallpapermanager.flutter_wallpaper_manager"

          if not re.search(r'(?m)^\s*namespace\s+', text):

              match = re.search(
                  r'android\s*\{',
                  text
              )

              if not match:
                  raise SystemExit(
                      "ERROR: Plugin android block not found."
                  )

              text = (
                  text[:match.end()]
                  + '\n    namespace "' + namespace + '"\n'
                  + text[match.end():]
              )

              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)

          print("Plugin namespace fixed.")
          PY

          else
            echo "ERROR: Plugin build.gradle not found."
            exit 1
          fi


          # ======================================
          # REMOVE OLD PACKAGE ATTRIBUTE
          # ======================================

          if [ -f "$PLUGIN_MANIFEST" ]; then

            python3 - "$PLUGIN_MANIFEST" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # Remove old package="..."
          text = re.sub(
              r'\s+package\s*=\s*"[^"]*"',
              '',
              text,
              count=1
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Old package attribute removed.")
          PY

          else
            echo "ERROR: Plugin AndroidManifest.xml not found."
            exit 1
          fi


          echo "========================================"
          echo "PLUGIN MANIFEST AFTER FIX"
          echo "========================================"

          cat "$PLUGIN_MANIFEST"


          echo "========================================"
          echo "PLUGIN GRADLE AFTER FIX"
          echo "========================================"

          cat "$PLUGIN_BUILD"


      # ==========================================
      # BUILD APK
      # ==========================================

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release


      # ==========================================
      # SAVE APK
      # ==========================================

      - name: Save Real BTS Army APK
        uses: actions/upload-artifact@v4
        with:
          name: Real-BTS-Army-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
