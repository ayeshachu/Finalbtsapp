name: Flutter APK Cloud Compiler

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Extract Flutter Project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          rm -rf extracted_project
          mkdir extracted_project

          unzip -q "$ZIP_FILE" -d extracted_project

          PROJECT_DIR=$(find extracted_project -type f -name "pubspec.yaml" -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found inside ZIP."
            find extracted_project -maxdepth 3 -type f | head -n 100
            exit 1
          fi

          echo "Flutter project root: $PROJECT_DIR"

          shopt -s dotglob
          cp -R "$PROJECT_DIR"/* .
          shopt -u dotglob

          if [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml was not copied."
            exit 1
          fi

          echo "Flutter project successfully prepared."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show Flutter Version
        run: |
          flutter --version
          dart --version

      - name: Flutter Clean
        run: flutter clean

      - name: Get Dependencies
        run: flutter pub get

      - name: Repair flutter_wallpaper_manager Namespace
        shell: bash
        run: |
          set -e

          PLUGIN_DIR=$(find "$HOME/.pub-cache/hosted/pub.dev" \
            -maxdepth 1 \
            -type d \
            -name "flutter_wallpaper_manager-*" \
            -not -name "*-example" \
            | sort -V | tail -n 1)

          if [ -z "$PLUGIN_DIR" ]; then
            echo "flutter_wallpaper_manager not found."
            exit 1
          fi

          echo "Plugin directory:"
          echo "$PLUGIN_DIR"

          PLUGIN_BUILD="$PLUGIN_DIR/android/build.gradle"

          if [ ! -f "$PLUGIN_BUILD" ]; then
            echo "ERROR: Actual plugin build.gradle not found."
            exit 1
          fi

          echo "Plugin build.gradle:"
          cat "$PLUGIN_BUILD"

          if grep -q "namespace" "$PLUGIN_BUILD"; then
            echo "Namespace already exists."
          else
            MANIFEST="$PLUGIN_DIR/android/src/main/AndroidManifest.xml"

            if [ -f "$MANIFEST" ]; then
              PACKAGE=$(grep -oP 'package="\K[^"]+' "$MANIFEST" | head -n 1 || true)
            else
              PACKAGE=""
            fi

            if [ -z "$PACKAGE" ]; then
              PACKAGE="com.example.flutter_wallpaper_manager"
            fi

            echo "Using namespace: $PACKAGE"

            python3 - "$PLUGIN_BUILD" "$PACKAGE" <<'PY'
          import sys

          build_file = sys.argv[1]
          namespace = sys.argv[2]

          with open(build_file, "r", encoding="utf-8") as f:
              text = f.read()

          if "android {" not in text:
              raise SystemExit("ERROR: android block not found in ACTUAL plugin build.gradle")

          text = text.replace(
              "android {",
              f'android {{\n    namespace "{namespace}"',
              1
          )

          with open(build_file, "w", encoding="utf-8") as f:
              f.write(text)

          print("Namespace successfully added.")
          PY
          fi

          echo "Final plugin build.gradle:"
          cat "$PLUGIN_BUILD"

      - name: Verify Flutter Project
        run: |
          test -f pubspec.yaml
          flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Save Real APK File
        uses: actions/upload-artifact@v4
        with:
          name: Real-BTS-Army-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
