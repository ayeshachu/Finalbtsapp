name: Flutter APK Cloud Compiler

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate Flutter Project
        shell: bash
        run: |
          set -e

          echo "Searching for pubspec.yaml..."

          PUBSPEC=$(find . \
            -not -path "./.git/*" \
            -type f \
            -name "pubspec.yaml" \
            -print -quit || true)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found."
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check Project Structure
        shell: bash
        run: |
          set -e

          echo "Project:"
          echo "$PROJECT_DIR"

          echo "Checking files..."

          test -f "$PROJECT_DIR/pubspec.yaml"

          if [ ! -f "$PROJECT_DIR/android/app/build.gradle" ]; then
            echo "build.gradle not found."

            echo "Searching Android Gradle files:"
            find "$PROJECT_DIR/android" \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print

            exit 1
          fi

          echo "Android app Gradle file found."

      - name: Flutter Clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter clean

      - name: Get Dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      # ==========================================
      # FLUTTER WALLPAPER MANAGER NAMESPACE FIX
      # ==========================================

      - name: Fix flutter_wallpaper_manager Namespace
        shell: bash
        run: |
          set -e

          PLUGIN_DIR=$(find "$HOME/.pub-cache/hosted/pub.dev" \
            -maxdepth 1 \
            -type d \
            -name "flutter_wallpaper_manager-*" \
            -not -name "*-example" \
            | sort -V | tail -n 1 || true)

          if [ -z "$PLUGIN_DIR" ]; then
            echo "flutter_wallpaper_manager not found."
            exit 1
          fi

          PLUGIN_BUILD="$PLUGIN_DIR/android/build.gradle"

          echo "Using:"
          echo "$PLUGIN_BUILD"

          if [ ! -f "$PLUGIN_BUILD" ]; then
            echo "ERROR: Plugin build.gradle not found."
            exit 1
          fi

          python3 - "$PLUGIN_BUILD" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          if re.search(r'(?m)^\s*namespace\s+["\']', text):
              print("Namespace already exists.")
          else:
              match = re.search(r'android\s*\{', text)

              if not match:
                  raise SystemExit(
                      "ERROR: android block not found."
                  )

              text = (
                  text[:match.end()]
                  + '\n    namespace "com.flutter_wallpaper_manager"\n'
                  + text[match.end():]
              )

              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)

              print("Namespace added.")

          PY

      # ==========================================
      # CORE LIBRARY DESUGARING
      # ==========================================

      - name: Enable Core Library Desugaring
        shell: bash
        run: |
          set -e

          APP_GRADLE="$PROJECT_DIR/android/app/build.gradle"

          echo "App Gradle:"
          echo "$APP_GRADLE"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: App build.gradle not found."
            exit 1
          fi

          python3 - "$APP_GRADLE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # Add compileOptions if missing
          if "coreLibraryDesugaringEnabled true" not in text:

              match = re.search(
                  r'compileOptions\s*\{',
                  text
              )

              if match:
                  pos = match.end()

                  text = (
                      text[:pos]
                      + "\n        coreLibraryDesugaringEnabled true\n"
                      + text[pos:]
                  )

              else:
                  android = re.search(
                      r'android\s*\{',
                      text
                  )

                  if not android:
                      raise SystemExit(
                          "ERROR: android block not found."
                      )

                  pos = android.end()

                  block = """
              
              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              """

                  text = text[:pos] + block + text[pos:]

          # Add desugaring dependency
          if "desugar_jdk_libs" not in text:

              dependency = (
                  "coreLibraryDesugaring "
                  "'com.android.tools:desugar_jdk_libs:2.1.5'"
              )

              match = re.search(
                  r'dependencies\s*\{',
                  text
              )

              if not match:
                  raise SystemExit(
                      "ERROR: dependencies block not found."
                  )

              pos = match.end()

              text = (
                  text[:pos]
                  + "\n    "
                  + dependency
                  + "\n"
                  + text[pos:]
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Core library desugaring configured.")

          PY

          echo "Desugaring configuration complete."

      # ==========================================
      # BUILD APK
      # ==========================================

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      # ==========================================
      # SAVE APK
      # ==========================================

      - name: Save Real APK File
        uses: actions/upload-artifact@v4
        with:
          name: Real-BTS-Army-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
