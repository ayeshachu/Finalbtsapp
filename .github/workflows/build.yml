name: Flutter APK Cloud Compiler

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find Flutter Project
        id: find_project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find . -name "pubspec.yaml" \
            -not -path "./.git/*" \
            -print -quit \
            | xargs dirname)

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          fi

          echo "Flutter project found at: $PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Clean
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: flutter clean

      - name: Flutter Pub Get
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: flutter pub get

      - name: Patch flutter_wallpaper_manager
        shell: bash
        run: |
          set -e

          echo "Searching flutter_wallpaper_manager..."

          PACKAGE_DIR=$(find "$HOME/.pub-cache" \
            -type d \
            -path "*/flutter_wallpaper_manager-*/android" \
            | head -n 1)

          if [ -z "$PACKAGE_DIR" ]; then
            echo "ERROR: flutter_wallpaper_manager Android folder not found."
            exit 1
          fi

          BUILD_FILE="$PACKAGE_DIR/build.gradle"

          echo "Package build file:"
          echo "$BUILD_FILE"

          python3 - "$BUILD_FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          if re.search(r'(?m)^\s*namespace\s+["\']', text):
              print("Namespace already exists.")
          else:
              match = re.search(r'android\s*\{', text)

              if not match:
                  raise SystemExit(
                      "ERROR: android { block not found."
                  )

              namespace = 'namespace "com.flutter_wallpaper_manager"'

              text = (
                  text[:match.end()]
                  + "\n    "
                  + namespace
                  + "\n"
                  + text[match.end():]
              )

              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)

              print("Namespace added successfully.")

          PY

          grep -q 'namespace "com.flutter_wallpaper_manager"' "$BUILD_FILE"

          echo "Namespace verification successful."

      - name: Build Release APK
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: flutter build apk --release

      - name: Save Real APK File
        uses: actions/upload-artifact@v4
        with:
          name: BTS-Army-World-APK
          path: ${{ steps.find_project.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk        
