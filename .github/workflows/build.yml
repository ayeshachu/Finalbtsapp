name: Flutter APK Cloud Compiler

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # EXTRACT THE PROJECT ZIP
      # ==========================================

      - name: Extract Flutter Project
        shell: bash
        run: |
          set -e

          echo "Repository files:"
          ls -la

          ZIP_FILE=$(find . \
            -maxdepth 1 \
            -type f \
            -iname "*.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found."
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -o "$ZIP_FILE" -d extracted_project

          echo "Searching for pubspec.yaml..."

          PUBSPEC=$(find extracted_project \
            -type f \
            -name "pubspec.yaml" \
            -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found inside ZIP."
            echo "Extracted files:"
            find extracted_project -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "================================="
          echo "Flutter project found:"
          echo "$PROJECT_DIR"
          echo "================================="

          # Copy project to repository root
          shopt -s dotglob
          cp -R "$PROJECT_DIR"/* .
          shopt -u dotglob

          if [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: Project was not copied correctly."
            exit 1
          fi

          echo "Flutter project is now at repository root."

          echo "Project files:"
          ls -la

      # ==========================================
      # JAVA
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      # ==========================================
      # FLUTTER
      # ==========================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Version
        run: flutter --version

      # ==========================================
      # FLUTTER CLEAN + PUB GET
      # ==========================================

      - name: Flutter Clean
        run: flutter clean

      - name: Get Dependencies
        run: flutter pub get

      # ==========================================
      # FIX WALLPAPER MANAGER
      # ==========================================

      - name: Fix flutter_wallpaper_manager Namespace
        shell: bash
        run: |
          set -e

          PLUGIN_DIR=$(find "$HOME/.pub-cache/hosted/pub.dev" \
            -maxdepth 1 \
            -type d \
            -name "flutter_wallpaper_manager-*" \
            -not -name "*-example" \
            | sort -V | tail -n 1 || true)

          if [ -z "$PLUGIN_DIR" ]; then
            echo "flutter_wallpaper_manager not found."
            exit 1
          fi

          PLUGIN_BUILD="$PLUGIN_DIR/android/build.gradle"

          echo "Plugin:"
          echo "$PLUGIN_BUILD"

          if [ ! -f "$PLUGIN_BUILD" ]; then
            echo "ERROR: Plugin build.gradle not found."
            exit 1
          fi

          python3 - "$PLUGIN_BUILD" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          if re.search(r'(?m)^\s*namespace\s+["\']', text):
              print("Namespace already exists.")
          else:
              match = re.search(r'android\s*\{', text)

              if not match:
                  raise SystemExit(
                      "ERROR: android block not found."
                  )

              text = (
                  text[:match.end()]
                  + '\n    namespace "com.flutter_wallpaper_manager"\n'
                  + text[match.end():]
              )

              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)

              print("Namespace added successfully.")

          PY

      # ==========================================
      # FIX LOCAL NOTIFICATIONS DESUGARING
      # ==========================================

      - name: Enable Core Library Desugaring
        shell: bash
        run: |
          set -e

          APP_GRADLE="android/app/build.gradle"

          echo "Checking:"
          echo "$APP_GRADLE"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: android/app/build.gradle not found."
            exit 1
          fi

          python3 - "$APP_GRADLE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # Add compileOptions
          if "coreLibraryDesugaringEnabled true" not in text:

              match = re.search(
                  r'compileOptions\s*\{',
                  text
              )

              if match:
                  pos = match.end()

                  text = (
                      text[:pos]
                      + "\n        coreLibraryDesugaringEnabled true\n"
                      + text[pos:]
                  )

              else:
                  android = re.search(
                      r'android\s*\{',
                      text
                  )

                  if not android:
                      raise SystemExit(
                          "ERROR: android block not found."
                      )

                  pos = android.end()

                  block = """
              
              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              """

                  text = text[:pos] + block + text[pos:]

          # Add desugaring dependency
          if "desugar_jdk_libs" not in text:

              dependency = (
                  "coreLibraryDesugaring "
                  "'com.android.tools:desugar_jdk_libs:2.1.5'"
              )

              match = re.search(
                  r'dependencies\s*\{',
                  text
              )

              if not match:
                  raise SystemExit(
                      "ERROR: dependencies block not found."
                  )

              pos = match.end()

              text = (
                  text[:pos]
                  + "\n    "
                  + dependency
                  + "\n"
                  + text[pos:]
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Desugaring successfully configured.")

          PY

      # ==========================================
      # VERIFY
      # ==========================================

      - name: Verify Android Project
        run: |
          test -f pubspec.yaml
          test -f android/app/build.gradle
          echo "Flutter project verified."
          echo "pubspec.yaml: OK"
          echo "android/app/build.gradle: OK"

      # ==========================================
      # BUILD APK
      # ==========================================

      - name: Build Release APK
        run: flutter build apk --release

      # ==========================================
      # SAVE APK
      # ==========================================

      - name: Save Real APK File
        uses: actions/upload-artifact@v4
        with:
          name: Real-BTS-Army-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
